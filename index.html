<style>

$("sml").innerHTML='<div class="txt" style="margin:0 0 10px"><b>'+esc(u.display_name)+'</b> '+esc(p.body||"Reshared post")+'</div>'+(p.replies.length?p.replies.map(function(r){return '<div class="rep"><b>'+esc((r.profiles||{}).display_name)+'</b> '+esc(r.body)+((r.user_id===me.id||me.is_admin)?' <button data-delrep="'+r.id+'" aria-label="Delete comment" style="color:var(--mute)">✕</button>':"")+'</div>'}).join(""):'<div class="empty" style="padding:30px 0">No comments yet. Be the first.</div>')}
async function sendC(){var v=$("smi").value.trim();if(!v||!cm)return;$("sms").disabled=true;er(await sb.from("replies").insert({post_id:cm,user_id:me.id,body:v.slice(0,280)}));$("smi").value="";$("sms").disabled=false;await refresh()}
async function refresh(){
var f=await sb.from("follows").select("follower,followee");allf=f.data||[];follows=new Set(allf.filter(function(x){return x.follower===me.id}).map(function(x){return x.followee}));
var r=await sb.from("posts").select("id,body,category,repost_of,image_url,created_at,user_id,profiles!user_id(display_name,username,level,is_admin,avatar_url),likes(user_id),dislikes(user_id),replies(id,user_id,body,profiles!user_id(display_name))").order("created_at",{ascending:false}).limit(100);
if(er(r)){$("er").textContent="Could not load posts: "+r.error.message}
posts=r.data||[];render();if($("dm").open)sheet()}
function profilePage(u,self){
var fr=allf.filter(function(x){return x.followee===u.id}).length,fg=allf.filter(function(x){return x.follower===u.id}).length,mp=posts.filter(function(p){return p.user_id===u.id}),c=[],body="";
if(ptab==="Posts"){c=mp.filter(function(p){return !p.repost_of});var pn=c.filter(function(p){return p.id===u.pinned_post})[0];if(pn)c=[pn].concat(c.filter(function(p){return p!==pn}))}
else if(ptab==="Reshares")c=mp.filter(function(p){return p.repost_of});
else if(ptab==="Media")c=mp.filter(function(p){return p.image_url});
if(ptab==="Replies"){posts.forEach(function(p){p.replies.forEach(function(r){if(r.user_id===u.id)body+='<div class="post"><div class="mt">Replying to '+esc((p.profiles||{}).display_name)+'</div><div class="txt">'+esc(r.body)+'</div></div>'})});if(!body)body='<div class="empty">No replies yet.</div>'}
else body=c.length?c.map(card).join(""):'<div class="empty">Nothing here yet.</div>';
return (self?"":'<button class="btn sm alt" data-v="home" style="margin:10px 18px">‹ Back</button>')+'<div class="ban" style="'+(u.banner_url?"background-image:url('"+esc(u.banner_url)+"')":"")+'"></div><div class="pr"><div class="ph" style="margin-top:-38px;align-items:flex-end;justify-content:space-between"><span class="pav">'+av(u,84)+'</span><div style="display:flex;gap:8px;padding-bottom:4px">'+(self?'<button class="btn sm alt" data-edit="1">Edit profile</button>':fbtn(u.id))+'<button class="btn sm alt" data-sharep="'+esc(u.username)+'">Share</button></div></div>'+
'<div class="nm" style="font-size:21px;margin-top:8px">'+esc(u.display_name)+(u.is_admin?VER:"")+'</div><div class="mt">@'+esc(u.username)+'</div><p>'+esc(u.bio||"HIS student at Unical.")+'</p><div class="mt"><span class="lv">'+esc(u.level)+'</span> Joined '+new Date(u.created_at).toLocaleDateString("en",{month:"long",year:"numeric"})+'</div><div class="mt" style="margin-top:6px"><b style="color:var(--ink)">'+fg+'</b> Following <b style="color:var(--ink)">'+fr+'</b> Followers</div>'+(self?'<button class="btn alt" data-out="1">Log out</button>':"")+'</div>'+
'<div class="tabs" style="gap:16px" role="tablist">'+["Posts","Replies","Reshares","Media"].map(function(t){return '<button role="tab" data-pt="'+t+'" aria-selected="'+(t===ptab)+'">'+t+'</button>'}).join("")+'</div>'+body}
function drw(){var fr=allf.filter(function(x){return x.followee===me.id}).length;
function mi(i,t,a,soon){return '<button class="mi" '+(soon?"disabled":a)+'>'+ic(i,0,24)+t+(soon?'<span class="soon">Soon</span>':"")+'</button>'}
$("drw").innerHTML=av(me,60)+'<div class="nm" style="font-size:20px;margin-top:10px">'+esc(me.display_name)+(me.is_admin?VER:"")+'</div><div class="mt">@'+esc(me.username)+'</div><div class="mt" style="margin:8px 0 14px"><b style="color:var(--ink)">'+follows.size+'</b> Following <b style="color:var(--ink)">'+fr+'</b> Followers</div>'+mi("user","Profile",'data-v="me"')+mi("edit","Edit profile",'data-edit="1"')+mi("people","Communities","",1)+mi("game","Games","",1)+mi("mail","Messages","",1)+mi("mark","Saved","",1)+mi("out","Log out",'data-out="1"')+'<div class="credit">From <b>Vellouz Tech</b><br>by HEISMAVY</div>'}
function render(){
if(!me)return;
$("hm").style.background=col(me.id);$("hm").innerHTML=me.avatar_url?'<img src="'+esc(me.avatar_url)+'" alt="">':esc(me.display_name[0].toUpperCase());drw();
$("nv").innerHTML=[["home","Home","home"],["notices","Notices","mega"],["search","Search","search"],["me","Profile","user"]].map(function(x){var on=x[0]==="me"?(view==="user"&&vu===me.id):view===x[0];return '<button data-v="'+x[0]+'" aria-current="'+on+'">'+ic(x[2],on)+x[1]+'</button>'}).join("");
$("fab").innerHTML=ic("plus",0,26);$("fab").style.display=view==="home"||view==="notices"?"":"none";
$("hd").innerHTML=view==="home"?'<div class="tabs" role="tablist">'+["Your Feed","Trend"].map(function(t){return '<button role="tab" data-tab="'+t+'" aria-selected="'+(t===tab)+'">'+t+'</button>'}).join("")+'</div>':"";
var h="",l;
if(view==="home"){l=posts.filter(function(p){return tab==="Trend"||follows.has(p.user_id)||p.user_id===me.id});
if(tab==="Trend")l=l.slice().sort(function(a,b){return b.likes.length-a.likes.length});
h=l.length?l.map(card).join(""):'<div class="empty">'+(tab==="Trend"?"Nothing trending yet.":"Your feed is empty. Find coursemates in Search and follow them to see their posts.")+'</div>'}
else if(view==="notices"){l=posts.filter(function(p){return p.category==="Announcements"&&!p.repost_of});h='<div class="sec">Department notices</div>'+(l.length?l.map(card).join(""):'<div class="empty">No notices yet.</div>')}
else if(view==="search"){h='<div style="padding:14px 18px"><input id="q" placeholder="Search people" aria-label="Search" value="'+esc(q)+'"></div><div id="sr"></div>';$("feed").innerHTML=h;sres();return}
else{var u=vu===me.id?me:users[vu];users[me.id]=me;h=profilePage(u,vu===me.id)}
$("feed").innerHTML=h}
async function openUser(id){if(id!==me.id){var r=await sb.from("profiles").select(PF).eq("id",id).single();if(er(r))return;users[id]=r.data}vu=id;ptab="Posts";view="user";render();scrollTo(0,0)}
async function sres(){var s=q.trim();if(!s){$("sr").innerHTML='<div class="empty">Type a name to find coursemates and lecturers.</div>';return}
var r=await sb.from("profiles").select("id,display_name,username,level,bio,is_admin,avatar_url").or("display_name.ilike.%"+s.replace(/[^a-zA-Z0-9 ]/g,"")+"%,username.ilike.%"+s.replace(/[^a-zA-Z0-9]/g,"")+"%").neq("id",me.id).limit(20),d=r.data||[];
$("sr").innerHTML=d.length?d.map(function(u){return '<div class="row">'+av(u,40)+'<div class="g"><b>'+esc(u.display_name)+'</b><div class="mt">'+esc(u.level)+" · @"+esc(u.username)+'</div></div>'+fbtn(u.id)+'</div>'}).join(""):'<div class="empty">No one found.</div>'}
async function start(uid){
var r=await sb.from("profiles").select("*").eq("id",uid).single();
if(!r.data){$("ar").textContent="Setting up your profile. Please try again.";return showAuth()}
me=r.data;$("auth").hidden=true;$("app").hidden=false;await refresh();
if(location.hash.length>1){var hr=await sb.from("profiles").select(PF).eq("username",decodeURIComponent(location.hash.slice(1)).toLowerCase()).maybeSingle();if(hr.data){users[hr.data.id]=hr.data;vu=hr.data.id;ptab="Posts";view="user";render()}}}
function showAuth(){me=null;$("app").hidden=true;$("auth").hidden=false}
function authMode(){$("sn").hidden=!signup;$("ab").textContent=signup?"Create account":"Log in";$("at").textContent=signup?"Have an account? Log in":"New here? Create an account";$("ap").autocomplete=signup?"new-password":"current-password";$("ar").textContent=""}
$("at").onclick=function(){signup=!signup;authMode()};
$("af").addEventListener("submit",async function(e){e.preventDefault();$("ab").disabled=true;$("ar").textContent="";var un=$("au").value.trim().toLowerCase().replace(/^@/,""),em=un+"@hisunical.app",pw=$("ap").value,r;
if(!/^[a-z0-9_]{3,20}$/.test(un)){$("ar").textContent="Username: 3 to 20 letters, numbers or underscore.";$("ab").disabled=false;return}
if(signup){var nm=$("an").value.trim();if(nm.length<2){$("ar").textContent="Enter your name.";$("ab").disabled=false;return}
r=await sb.auth.signUp({email:em,password:pw,options:{data:{display_name:nm,username:un,level:$("al").value}}});
if(!r.error&&!r.data.session){$("ar").textContent="Account created but not confirmed. Turn off Confirm email in Supabase.";$("ab").disabled=false;return}}
else r=await sb.auth.signInWithPassword({email:em,password:pw});
$("ab").disabled=false;if(r.error){var m=r.error.message;$("ar").textContent=/registered/i.test(m)?"That username is taken.":/invalid login/i.test(m)?"Wrong username or password.":m;return}
start(r.data.user.id)});
async function react(id,kind){var p=posts.filter(function(x){return x.id==id})[0],other=kind==="likes"?"dislikes":"likes",k={user_id:me.id,post_id:p.id};
if(mine(p[kind]))er(await sb.from(kind).delete().match(k));else{await sb.from(other).delete().match(k);er(await sb.from(kind).insert(k))}refresh()}
function renderEd(){var bu=draft.bn===null?"":draft.bn?URL.createObjectURL(draft.bn):me.banner_url,au=draft.av?URL.createObjectURL(draft.av):me.avatar_url;
$("ebv").style.backgroundImage=bu?"url('"+bu+"')":"none";$("ebr").hidden=!bu;
$("eav").style.background=col(me.id);$("eav").innerHTML=au?'<img src="'+esc(au)+'" alt="">':esc(me.display_name[0].toUpperCase())}
function cnt(){$("enc").textContent=$("en").value.length+"/30";$("ebn").textContent=$("eb").value.length+"/160"}
function openEdit(){draft={};$("en").value=me.display_name;$("eb").value=me.bio||"";$("ee").textContent="";$("fa").value="";$("fb").value="";
$("el").innerHTML=["100L","200L","300L","400L"].concat(me.is_admin?["Staff"]:[]).map(function(x){return "<option>"+x+"</option>"}).join("");$("el").value=me.level;
$("ex").innerHTML=ic("x",0,24);$("ebc").innerHTML=ic("cam");$("ebr").innerHTML=ic("x");$("eac").innerHTML=ic("cam");
cnt();renderEd();$("ed").hidden=false;$("ed").scrollTop=0}
function closeEd(){$("ed").hidden=true}
$("ex").onclick=closeEd;
$("ebc").onclick=function(){$("fb").click()};$("eac").onclick=function(){$("fa").click()};
$("ebr").onclick=function(){draft.bn=null;renderEd()};
$("fb").onchange=function(){if(this.files[0]){draft.bn=this.files[0];renderEd()}};
$("fa").onchange=function(){if(this.files[0]){draft.av=this.files[0];renderEd()}};
$("en").addEventListener("input",cnt);$("eb").addEventListener("input",cnt);
$("es").onclick=async function(){var n=$("en").value.trim();if(n.length<2){$("ee").textContent="Name must be at least 2 letters.";return}
var btn=this;btn.disabled=true;$("ee").textContent="Saving...";
var upd={display_name:n,bio:$("eb").value.trim(),level:$("el").value};
if(draft.av){var a=await upload(draft.av,400);if(!a){btn.disabled=false;return}upd.avatar_url=a}
if(draft.bn===null)upd.banner_url=null;else if(draft.bn){var b=await upload(draft.bn,1200);if(!b){btn.disabled=false;return}upd.banner_url=b}
var r=await sb.from("profiles").update(upd).eq("id",me.id);btn.disabled=false;
if(r.error){$("ee").textContent=r.error.message;return}
Object.assign(me,upd);users[me.id]=me;closeEd();refresh()};
document.addEventListener("click",async function(e){var b=e.target.closest("[data-menu],[data-v],[data-tab],[data-pt],[data-like],[data-dis],[data-rep],[data-p],[data-close],[data-follow],[data-del],[data-delrep],[data-share],[data-sharep],[data-pin],[data-edit],[data-out],#fab,#cb");if(!b)return;var d=b.dataset;
if(!d.menu&&$("drw").classList.contains("on"))menu(false);
if(d.menu){menu(d.menu==="1")}
else if(d.v){$("er").textContent="";if(d.v==="me"){openUser(me.id);return}view=d.v;render();scrollTo(0,0)}
else if(d.tab){tab=d.tab;render()}
else if(d.pt){ptab=d.pt;render()}
else if(d.like){react(d.like,"likes")}
else if(d.dis){react(d.dis,"dislikes")}
else if(d.rep){cm=+d.rep;$("smi").value="";sheet();$("dm").showModal()}
else if(d.delrep){er(await sb.from("replies").delete().eq("id",d.delrep));refresh()}
else if(d.share){var p=posts.filter(function(x){return x.id==d.share})[0];rsT=p.repost_of||p.id;var o=posts.filter(function(x){return x.id===rsT})[0];
$("rem").innerHTML=o?'<b>'+esc((o.profiles||{}).display_name)+'</b><div>'+esc(o.body)+'</div>'+(o.image_url?'<img class="pimg" src="'+esc(o.image_url)+'" alt="Post photo">':""):"Original post";$("rt").value="";$("dr").showModal()}
else if(d.sharep){var url=location.origin+location.pathname+"#"+d.sharep;try{if(navigator.share){await navigator.share({url:url})}else{await navigator.clipboard.writeText(url);alert("Profile link copied")}}catch(x){}}
else if(d.pin){var np=me.pinned_post===+d.pin?null:+d.pin;if(!er(await sb.from("profiles").update({pinned_post:np}).eq("id",me.id))){me.pinned_post=np;render()}}
else if(d.del){if(confirm("Delete this post?")){er(await sb.from("posts").delete().eq("id",d.del));refresh()}}
else if(d.p){openUser(d.p)}
else if(d.follow){if(follows.has(d.follow))er(await sb.from("follows").delete().match({follower:me.id,followee:d.follow}));else er(await sb.from("follows").insert({follower:me.id,followee:d.follow}));await refresh();if(view==="search")sres()}
else if(d.edit){openEdit()}
else if(d.close){$(d.close).close()}
else if(d.out){await sb.auth.signOut();showAuth()}
else if(b.id==="cb"){$("cf").click()}
else if(b.id==="fab"){var o2=["General","Study","Events","Questions"];if(me.is_admin)o2.unshift("Announcements");$("ck").innerHTML=o2.map(function(x){return "<option>"+x+"</option>"}).join("");if(view==="notices"&&me.is_admin)$("ck").value="Announcements";$("dc").showModal()}});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;clearTimeout(window._t);window._t=setTimeout(sres,250)}});
$("ct").addEventListener("input",function(){var n=280-this.value.length;$("cc").textContent=n;$("cg").disabled=!this.value.trim()||n<0});
$("cf").addEventListener("change",function(){var f=this.files[0];if(f){$("cv").src=URL.createObjectURL(f);$("cv").hidden=false}});
$("fc").addEventListener("submit",async function(){var t=$("ct").value.trim();if(!t||t.length>280)return;var f=$("cf").files[0],img=null;if(f)img=await upload(f,1000);
er(await sb.from("posts").insert({user_id:me.id,category:$("ck").value,body:t,image_url:img}));
$("ct").value="";$("cc").textContent=280;$("cg").disabled=true;$("cf").value="";$("cv").hidden=true;refresh()});
$("fr").addEventListener("submit",async function(){er(await sb.from("posts").insert({user_id:me.id,category:"General",body:$("rt").value.trim().slice(0,280),repost_of:rsT}));refresh()});
$("sms").onclick=sendC;$("smx").onclick=function(){$("dm").close()};
$("smi").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();sendC()}});
setInterval(function(){var a=document.activeElement;if(me&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&!$("dc").open&&!$("dm").open&&!$("dr").open&&$("ed").hidden)refresh()},30000);
authMode();
sb.auth.getSession().then(function(r){r.data.session?start(r.data.session.user.id):showAuth()});
