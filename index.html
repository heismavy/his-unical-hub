<!DOCTYPE html>
<html lang="en">

<style>

main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.post{padding:16px 18px 8px;border-bottom:1px solid var(--line)}
.post.ann{background:var(--chip)}
.ph{display:flex;gap:12px;align-items:center}
.nm{font-weight:800;display:flex;align-items:center;gap:5px}
.mt{color:var(--mute);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.emb{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px;overflow-wrap:anywhere}

.ac button{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13.5px}
.ac .sp{margin-left:auto;color:var(--mute);font-size:12.5px}
.ac .on{color:var(--heart)}
.ac .don{color:var(--blue)}
.rep{margin:6px 0 0 8px;padding:8px 12px;background:var(--chip);border-radius:14px;font-size:14px}
.rf{display:flex;gap:8px;margin:8px 0}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--chip);border:2px solid transparent;border-radius:14px;padding:10px 14px;outline:0}
.rf button,.btn{background:var(--btn);color:var(--btn-ink);border-radius:14px;font-weight:800;padding:11px 18px}
.btn{width:100%;margin-top:12px}.btn.alt{background:var(--chip);color:var(--ink)}
.btn.sm{width:auto;margin:0;padding:6px 14px;font-size:13px;border-radius:10px}
.empty{text-align:center;color:var(--mute);padding:56px 28px}
.sec{padding:14px 18px 4px;font-weight:800;font-size:17px}
.row{display:flex;gap:12px;align-items:center;padding:10px 18px}.row .g{flex:1;min-width:0}

nav button[aria-current=true]{color:var(--ink);font-weight:800}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
dialog{border:0;border-radius:26px;background:var(--bg);color:var(--ink);width:min(92vw,420px);padding:22px;margin:auto}
dialog::backdrop{background:rgba(10,12,20,.55)}
dialog h2{font-size:22px;font-weight:800;margin:0 0 10px}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:13px}
.cnt{float:right;font-size:12.5px;color:var(--mute)}
#auth{max-width:380px;margin:0 auto;padding:40px 22px;text-align:center}
#auth img{width:110px;height:110px;border-radius:50%}
#auth h1{font-size:28px;font-weight:800;margin:12px 0 2px}
#auth form{text-align:left}
.err{color:var(--heart);font-size:13.5px;margin-top:10px;text-align:center;min-height:18px}
#er{padding:0 18px}
.pr{padding:18px}.pr .av{width:72px;height:72px;font-size:30px}
</style>
</head>
<body>

<img src="logo.png" alt="NAHISS-UCC logo"><h1>HIS Unical Hub</h1>
<div class="mt" style="justify-content:center">History and International Studies</div>
<form id="af">

</form></div>

<div id="app" hidden>
<header><div class="w"><div class="top"><img src="logo.png" alt="NAHISS-UCC logo"><div><h1>HIS Unical Hub</h1><small>History and International Studies</small></div></div><div id="hd"></div></div></header>

<button class="fab" id="fab" aria-label="New post"></button>
<nav><div class="w" id="nv"></div></nav>
</div>

<dialog id="dc"><form method="dialog" id="fc"><h2>New post</h2>

<label for="ck">Category</label><select id="ck"></select>
<button class="btn" id="cg" disabled>Post</button>
<button class="btn alt" type="button" data-close="dc">Cancel</button></form></dialog>
<dialog id="de"><form method="dialog" id="fe"><h2>Edit profile</h2>
<label for="en">Name</label><input id="en" maxlength="30">
<label for="el">Level</label><select id="el"></select>
<label for="eb">Bio</label><textarea id="eb" rows="3" maxlength="120"></textarea>
<button class="btn">Save</button>
<button class="btn alt" type="button" data-close="de">Cancel</button></form></dialog>
<dialog id="dp"><div id="pbody"></div><button class="btn alt" data-close="dp">Close</button></dialog>
